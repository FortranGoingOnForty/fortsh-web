# fortsh.musicsian.com nginx configuration
# Copy to /etc/nginx/sites-available/ and symlink to sites-enabled

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fortsh.musicsian.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fortsh.musicsian.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/fortsh.musicsian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fortsh.musicsian.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Logging
    access_log /var/log/nginx/fortsh.access.log;
    error_log /var/log/nginx/fortsh.error.log;

    # Next.js application (reverse proxy)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Static assets with long cache
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Install script - serve directly with correct MIME type
    location = /install.sh {
        alias /var/www/fortsh.musicsian.com/current/public/install.sh;
        default_type text/plain;
        add_header Content-Type "text/plain; charset=utf-8";
    }

    # Favicon and static files
    location /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        expires 1w;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
